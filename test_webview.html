!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-${nonce}' 'unsafe-inline'; script-src 'nonce-${nonce}'; font-src 'self' data:;">
    <title>AI Assistant</title>
    <style nonce="${nonce}">
        :root {
            --bg: #10151f;
            --panel: #161b22;
            --text: #e6edf3;
            --muted: #8b949e;
            --border: #30363d;
            --accent: #2f81f7;
            --btn: #21262d;
            --btn-hover: #30363d;
            --code-bg: #0d1117;
            --code-header: #161b22;
            --code-text: #7ee787;
        }
        body.light {
            --bg: #ffffff !important;
            --panel: #f6f8fa !important;
            --text: #1f2328 !important;
            --muted: #656d76 !important;
            --border: #d0d7de !important;
            --accent: #0969da !important;
            --btn: #f6f8fa !important;
            --btn-hover: #eaeef2 !important;
            --code-bg: #f6f8fa !important;
            --code-header: #eaeef2 !important;
            --code-text: #1a7f37 !important;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--text); background: var(--bg); padding: 0; margin: 0; line-height: 1.6; overflow-y: auto; overflow-x: hidden; font-size: 13px; transition: background 0.2s, color 0.2s; }
        #app { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg); }

        /* Header */
        .sh { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: var(--bg); border-bottom: 1px solid var(--border); }
        .sh-logo { font-size: 26px; font-weight: 700; color: var(--text); font-family: Georgia, serif; }
        .sh-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
        .btn { background: var(--btn); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; user-select: none; }
        .btn:hover { background: var(--btn-hover); }
        .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* Toolbar */
        .toolbar { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .toolbar-row { display: flex; justify-content: space-between; align-items: center; }
        .toolbar-label { color: var(--muted); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .toolbar-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        select.lang-select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 7px 10px; border-radius: 6px; font-size: 12px; outline: none; cursor: pointer; }

        /* Content area */
        .content { padding: 16px; flex: 1; }
        .card-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin-bottom: 14px; color: var(--text); }
        
        /* Response body */
        .resp { font-size: 13px; line-height: 1.7; color: var(--text); }
        .resp p { margin: 0 0 12px; }
        .resp h1,.resp h2,.resp h3 { margin: 16px 0 8px; color: var(--text); }
        .resp ul,.resp ol { padding-left: 20px; margin: 0 0 12px; }
        .resp li { margin-bottom: 4px; }
        .resp strong { font-weight: 700; color: var(--text); }
        .resp code:not(pre code) { background: var(--code-header); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--code-text); }

        /* Code blocks — pure green on dark background without nested grey */
        .code-block { margin: 14px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
        .code-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px; background: var(--code-header); border-bottom: 1px solid var(--border); }
        .code-lang { font-size: 11px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .copy-btn { background: var(--btn); border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 3px 8px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .copy-btn:hover { color: var(--text); background: var(--btn-hover); }
        .code-block pre { margin: 0 !important; padding: 14px 16px !important; overflow-x: auto !important; max-height: 450px !important; background: var(--code-bg) !important; border: none !important; }
        .code-block code { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace !important; font-size: 12.5px !important; color: var(--code-text) !important; background: transparent !important; white-space: pre !important; display: block !important; line-height: 1.55 !important; border: none !important; padding: 0 !important; }
        
        /* Chat Discussion — exact match to image 3 */
        .chat-container { display: flex; flex-direction: column; gap: 14px; }
        .chat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; font-size: 13px; line-height: 1.65; color: var(--text); }
        .chat-card-user { background: var(--accent); color: #ffffff; border-radius: 10px; padding: 12px 16px; font-size: 13px; line-height: 1.6; align-self: flex-end; max-width: 85%; }
        .chat-card-user strong { color: #ffffff; }
        .chat-input-box { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); position: sticky; bottom: 0; margin-top: auto; }
        .chat-input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; font-size: 13px; outline: none; resize: none; min-height: 42px; max-height: 120px; font-family: inherit; }
        .chat-input:focus { border-color: var(--accent); }
        .chat-send-btn { background: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; align-self: flex-end; height: 42px; }
        .chat-send-btn:hover { opacity: 0.9; }

        /* States */
        .empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 12.5px; }
        .empty-icon { font-size: 36px; margin-bottom: 12px; }
        .loading { padding: 32px 16px; text-align: center; }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { background: #2d1515; border: 1px solid #f87171; color: #fca5a5; border-radius: 8px; padding: 14px; margin: 16px; font-size: 13px; }

        /* Footer */
        .footer { padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); background: var(--bg); font-size: 11px; color: var(--muted); }
        .footer-brand { display: flex; align-items: center; gap: 4px; }
    </style>
</head>
<body>
<div id="app"></div>
<script nonce="${nonce}">
    const vscode = acquireVsCodeApi();
    let S = { status: 'idle', mode: 'analyze' };
    let lastGen = 0;
    let lang = 'en';
    let isLight = false;
    let ttsOn = false;

    const LANGS = [
        { code:'en',  flag:'🇬🇧', name:'English' },
        { code:'hi',  flag:'🇮🇳', name:'Hindi (हिन्दी)' },
        { code:'bn',  flag:'🇮🇳', name:'Bengali (বাংলা)' },
        { code:'te',  flag:'🇮🇳', name:'Telugu (తెలుగు)' },
        { code:'mr',  flag:'🇮🇳', name:'Marathi (मराठी)' },
        { code:'ta',  flag:'🇮🇳', name:'Tamil (தமிழ்)' },
        { code:'gu',  flag:'🇮🇳', name:'Gujarati (ગુજરાતી)' },
        { code:'kn',  flag:'🇮🇳', name:'Kannada (ಕನ್ನಡ)' },
        { code:'ml',  flag:'🇮🇳', name:'Malayalam (മലയാളം)' },
        { code:'pa',  flag:'🇮🇳', name:'Punjabi (ਪੰਜਾਬੀ)' },
        { code:'or',  flag:'🇮🇳', name:'Odia (ଓଡ଼ିଆ)' }
    ];

    const LANG_VOICE_CODES = {
        hi: 'hi-IN', bn: 'bn-IN', te: 'te-IN', mr: 'mr-IN',
        ta: 'ta-IN', gu: 'gu-IN', kn: 'kn-IN', ml: 'ml-IN',
        pa: 'pa-IN', or: 'or-IN', en: 'en-US'
    };

    window.addEventListener('message', function(ev) {
        try {
            var m = ev.data;
            if (m.command === 'updateState') {
                var g = typeof m.generation === 'number' ? m.generation : 0;
                if (g <= lastGen) return;
                lastGen = g;
                S = m.state;
                render();
                try { vscode.postMessage({ command: 'webviewReceivedUpdateState', generation: g }); } catch(_){}
            }
            if (m.command === 'uiLanguageChanged') {
                lang = m.code || 'en';
                render();
            }
        } catch(e){}
    });

    // ---- helpers ----
    function esc(s) {
        return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    function getLang() { return LANGS.find(l=>l.code===lang) || LANGS[0]; }

    function toggleTheme() {
        isLight = !isLight;
        if (isLight) {
            document.body.classList.add('light');
        } else {
            document.body.classList.remove('light');
        }
        render();
    }

    function toggleListen() {
        if (!window.speechSynthesis) return;
        if (ttsOn) {
            window.speechSynthesis.cancel();
            ttsOn = false;
            render();
            return;
        }
        var text = '';
        if (S.mode === 'chat') {
            if (S.chatMessages && S.chatMessages.length > 0) {
                var last = S.chatMessages[S.chatMessages.length - 1];
                text = last.content || '';
            } else if (S.chatLastAssistantContent) {
                text = S.chatLastAssistantContent;
            }
        } else {
            text = S.response || '';
        }
        if (!text.trim()) return;

        var cleanText = text.replace(/\`\`\`[\s\S]*?\`\`\`/g, ' Code snippet omitted. ').replace(/[*#_\`]/g, '');
        var utt = new SpeechSynthesisUtterance(cleanText);
        var targetLangCode = LANG_VOICE_CODES[lang] || 'en-US';
        utt.lang = targetLangCode;

        // Try to pick matching voice
        var voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
        if (voices && voices.length) {
            var match = voices.find(v => v.lang && v.lang.startsWith(targetLangCode.split('-')[0]));
            if (match) utt.voice = match;
        }

        utt.onend = function(){ ttsOn = false; render(); };
        utt.onerror = function(){ ttsOn = false; render(); };
        ttsOn = true;
        window.speechSynthesis.speak(utt);
        render();
    }

    function saveResponse() {
        var text = '';
        if (S.mode === 'chat') {
            if (S.chatMessages && S.chatMessages.length > 0) {
                text = S.chatMessages.map(m => (m.role==='user'?'**User:** ':'**AI Assistant:** ') + m.content).join('\n\n');
            } else if (S.chatLastAssistantContent) {
                text = S.chatLastAssistantContent;
            }
        } else {
            text = S.response || '';
        }
        vscode.postMessage({ command: 'chatSaveLastAssistant', text: text });
    }

    function onLangChange(code) {
        lang = code;
        vscode.postMessage({ command: 'setUiLanguage', code: code });
    }

    function copyCodeBlock(btn) {
        try {
            var block = btn.closest ? btn.closest('.code-block') : btn.parentElement.parentElement;
            var codeEl = block ? block.querySelector('code') : null;
            if (!codeEl) return;
            var text = codeEl.innerText || codeEl.textContent || '';
            var orig = btn.innerHTML;
            function showDone() {
                btn.innerHTML = '✔ Copied!';
                btn.style.color = '#7ee787';
                setTimeout(function(){
                    btn.innerHTML = orig;
                    btn.style.color = '';
                }, 2000);
            }

            // Method 1: Extension host clipboard write (guaranteed in VS Code)
            vscode.postMessage({ command: 'copyResponse', text: text });

            // Method 2: execCommand fallback
            try {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.top = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            } catch(_){}

            // Method 3: clipboard API fallback
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(function(){});
            }

            showDone();
        } catch(e) {}
    }

    function sendChat() {
        var inp = document.getElementById('chat-input');
        if (!inp) return;
        var text = (inp.value || '').trim();
        if (!text) return;
        inp.value = '';
        inp.style.height = '';
        vscode.postMessage({ command: 'chatSendMessage', text: text });
    }

    function onChatKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
    }

    // ---- render ----
    function render() {
        try {
            var app = document.getElementById('app');
            if (!app) return;

            // Ensure body light class matches state
            if (isLight) { document.body.classList.add('light'); }
            else { document.body.classList.remove('light'); }

            var action = S.action || (S.mode === 'chat' ? 'Chat Discussion' : 'AI Assistant');
            var provider = S.providerName || 'Siddhi';
            var brand = 'Siddhi';
            var curLang = getLang();
            var themeLabel = isLight ? '🌙 Night' : '☀️ Day';
            var listenLabel = ttsOn ? '⏹ Stop' : '🔊 Listen';

            var langOpts = LANGS.map(function(l){
                return '<option value="'+l.code+'"'+(l.code===lang?' selected':'')+'>'+l.flag+' '+l.name+'</option>';
            }).join('');

            var html =
                '<div class="sh">' +
                    '<div><div class="sh-logo">'+esc(brand)+'</div><div class="sh-sub">'+esc(action)+'</div></div>' +
                    '<button class="btn" onclick="toggleTheme()">'+themeLabel+'</button>' +
                '</div>' +
                '<div class="toolbar">' +
                    '<div class="toolbar-row">' +
                        '<span class="toolbar-label">🌐 Language</span>' +
                        '<div class="toolbar-actions">' +
                            '<span class="btn">'+curLang.flag+' '+curLang.name+'</span>' +
                            '<button class="btn'+(ttsOn?' active':'')+'" onclick="toggleListen()">'+listenLabel+'</button>' +
                            '<button class="btn" onclick="saveResponse()">📥 Save</button>' +
                        '</div>' +
                    '</div>' +
                    '<select class="lang-select" onchange="onLangChange(this.value)">'+langOpts+'</select>' +
                '</div>';

            // Main content
            if (S.mode === 'chat') {
                html += renderChat();
            } else if (S.status === 'idle') {
                html += '<div class="content"><div class="empty"><div class="empty-icon">🤖</div>Select some code and right-click to choose an AI action.</div></div>';
            } else if (S.status === 'loading') {
                html += '<div class="content"><div class="loading"><div class="spinner"></div><div style="color:var(--muted);">Generating '+esc(action)+' response...</div></div></div>';
            } else if (S.status === 'error') {
                html += '<div class="content"><div class="error">❌ '+esc(S.error||'An error occurred.')+'</div></div>';
            } else if (S.status === 'success') {
                html += '<div class="content">';
                html += '<div class="card-title">📄 '+esc(action)+'</div>';
                html += '<div class="resp">'+(S.responseHtml || '<pre><code>'+esc(S.response)+'</code></pre>')+'</div>';
                html += '</div>';
            }

            // Footer
            var charCount = 0;
            if (S.mode === 'chat' && S.chatMessages) {
                charCount = S.chatMessages.reduce((sum, m) => sum + (m.content ? m.content.length : 0), 0);
            } else {
                charCount = (S.response || '').length;
            }

            html +=
                '<div class="footer">' +
                    '<div class="footer-brand">✨ Powered by '+esc(brand)+' AI</div>' +
                    '<div>'+charCount+' characters</div>' +
                '</div>';

            app.innerHTML = html;

            // Re-attach textarea auto-resize
            var inp = document.getElementById('chat-input');
            if (inp) {
                inp.addEventListener('input', function(){ this.style.height=''; this.style.height=Math.min(this.scrollHeight,120)+'px'; });
            }
        } catch(e) {
            document.getElementById('app').innerHTML = '<div style="color:red;padding:20px">Render error: '+e.message+'</div>';
        }
    }

    function renderChat() {
        var msgs = S.chatMessages || [];
        var html = '<div class="content"><div class="card-title">💬 Chat Discussion</div>';
        html += '<div class="chat-container">';

        // If no messages yet, show selection preview in a clean card
        if (msgs.length === 0 && S.chatCodeContext && S.chatCodeContext.fileName) {
            var ctx = S.chatCodeContext;
            html += '<div class="chat-card">';
            html += '<div style="color:var(--muted);font-weight:600;margin-bottom:8px;font-size:12px;">📎 ' + esc(ctx.fileName) + ' (' + esc(ctx.languageName||ctx.languageId) + ', ' + ctx.lineCount + ' lines)</div>';
            if (ctx.selectedCodePreviewHtml) {
                html += ctx.selectedCodePreviewHtml;
            }
            html += '<div style="color:var(--muted);margin-top:10px;font-size:12.5px;">Ask anything about the selected code below.</div>';
            html += '</div>';
        }

        // Messages list
        for (var i = 0; i < msgs.length; i++) {
            var msg = msgs[i];
            if (msg.role === 'user') {
                html += '<div class="chat-card-user">' + esc(msg.content) + '</div>';
            } else {
                html += '<div class="chat-card"><div class="resp">' + (msg.renderedHtml || esc(msg.content)) + '</div></div>';
            }
        }

        if (S.status === 'loading') {
            html += '<div class="chat-card"><div style="color:var(--muted);font-style:italic;">⏳ Thinking...</div></div>';
        }

        html += '</div></div>'; // .chat-container, .content

        // Sticky chat input
        html +=
            '<div class="chat-input-box">' +
                '<textarea id="chat-input" class="chat-input" placeholder="Type your message..." onkeydown="onChatKey(event)" rows="1"></textarea>' +
                '<button class="chat-send-btn" onclick="sendChat()">Send</button>' +
            '</div>';

        return html;
    }

    try { vscode.postMessage({ command: 'ready' }); } catch(e) {}
    render();
</script>
</body>
</html>`
